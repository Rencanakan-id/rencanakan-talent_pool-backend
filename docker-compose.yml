services:
  db:
    image: postgres:18
    container_name: talentpool-postgres
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  app:
    build: .
    image: rencanakan-talentpool-api
    container_name: talentpool-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped

volumes:
  postgres-data:
